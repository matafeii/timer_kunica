<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таймер - КУНИЦА</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Tesla-style 3D Background -->
    <div id="canvas-container"></div>
    <div class="overlay"></div>
    <div class="celebration-container" id="celebration-container"></div>

    <div class="container" id="mainContainer">
      <h1>⏱️ ТАЙМЕР КУНИЦЫ</h1>

      <div class="input-group">
        <label for="minutes">Хвилин:</label>
        <input
          type="number"
          id="minutes"
          placeholder="0"
          min="0"
          max="999"
          value="25"
        />
        <label for="seconds">Секунд:</label>
        <input
          type="number"
          id="seconds"
          placeholder="0"
          min="0"
          max="59"
          value="0"
        />
      </div>

      <div class="timer-display" id="display">25:00</div>

      <div class="buttons">
        <button class="btn-start" id="startBtn" onclick="startTimer()">
          ▶ СТАРТ
        </button>
        <button class="btn-stop" id="stopBtn" onclick="stopTimer()" disabled>
          ⏸ СТОП
        </button>
        <button class="btn-reset" onclick="resetTimer()">↻ СКИНУТИ</button>
      </div>

      <div class="message" id="message"></div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
