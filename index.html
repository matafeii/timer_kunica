d<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Таймер - КУНИЦА</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- YouTube Video Background -->
    <div id="youtube-bg-container">
      <div id="youtube-player"></div>
    </div>

    <!-- Fallback video (if YouTube fails) -->
    <video id="video-bg" autoplay muted loop playsinline style="display: none">
      <source
        src="https://assets.mixkit.co/videos/preview/mixkit-night-sky-with-stars-and-clouds-24064-large.mp4"
        type="video/mp4"
      />
    </video>

    <div id="canvas-container"></div>
    <div class="overlay"></div>
    <div class="celebration-container" id="celebration-container"></div>
    <div class="scanlines"></div>

    <div class="container" id="mainContainer">
      <h1>⏱️ ТАЙМЕР КУНИЦЫ</h1>

      <div class="input-group">
        <label for="minutes">Хвилин:</label>
        <input
          type="number"
          id="minutes"
          placeholder="0"
          min="0"
          max="999"
          value="25"
        />
        <label for="seconds">Секунд:</label>
        <input
          type="number"
          id="seconds"
          placeholder="0"
          min="0"
          max="59"
          value="0"
        />
      </div>

      <div class="timer-display" id="display">25:00</div>

      <div class="buttons">
        <button class="btn-start" id="startBtn" onclick="startTimer()">
          ▶ СТАРТ
        </button>
        <button class="btn-stop" id="stopBtn" onclick="stopTimer()" disabled>
          ⏸ СТОП
        </button>
        <button class="btn-reset" onclick="resetTimer()">↻ СКИНУТИ</button>
      </div>

      <div class="message" id="message"></div>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      // YouTube API callback - must be global
      function onYouTubeIframeAPIReady() {
        if (typeof initYouTubePlayer === "function") {
          initYouTubePlayer();
        }
      }
    </script>

    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>

    <script src="main.js"></script>
  </body>
</html>
